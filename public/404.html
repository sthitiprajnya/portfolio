<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - SEGFAULT</title>
  <style>
    :root {
      --cyan: #00F5FF;
      --bg: #000000;
      --text: #7FA8C4;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      max-width: 600px;
      padding: 2rem;
      border: 1px solid rgba(0, 245, 255, 0.2);
      background: rgba(0, 245, 255, 0.05);
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.1);
      border-radius: 4px;
      text-align: left;
    }
    .error-code {
      color: var(--cyan);
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
      text-shadow: 0 0 8px rgba(0, 245, 255, 0.5);
    }
    .blink {
      animation: blinker 1s linear infinite;
      display: inline-block;
      width: 10px;
      height: 1.2rem;
      background-color: var(--cyan);
      vertical-align: middle;
      margin-left: 8px;
    }
    @keyframes blinker {
      50% { opacity: 0; }
    }
    .message {
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      color: #000;
      background-color: var(--cyan);
      text-decoration: none;
      font-weight: bold;
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.2s;
    }
    .btn:hover {
      box-shadow: 0 0 15px rgba(0, 245, 255, 0.6);
      transform: translateY(-2px);
    }
    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(0, 245, 255, 0.2);
      animation: scan 6s linear infinite;
      pointer-events: none;
    }
    .report-link {
      display: block;
      margin-top: 1rem;
      color: var(--text);
      text-decoration: none;
      font-size: 0.8rem;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .report-link:hover {
      opacity: 1;
      text-decoration: underline;
    }
    @keyframes scan {
      0% { top: -10%; }
      100% { top: 110%; }
    }
  </style>
</head>
<body>
  <div class="scan-line"></div>
  <div class="container">
    <div class="error-code">
      SEGFAULT: PAGE_NOT_FOUND · EXIT CODE 404
    </div>
    <div class="message">
      > Critical error encountered.<br>
      > The requested resource could not be located in the current memory segment.<br>
      > Attempting to trace execution... Failed.<br>
      > System suggests returning to a known safe state.<span class="blink"></span>
    </div>
    <a href="/portfolio/" class="btn">RETURN_TO_BASE</a>
    <!-- Day 84: Pre-filled GitHub issue report link -->
    <a href="https://github.com/sthitiprajnya/portfolio/issues/new?title=404+Error&body=I+found+a+404+error+on+the+portfolio+site." class="report-link" target="_blank" rel="noopener noreferrer">
      Report this error ↗
    </a>
  </div>
</body>
</html>
